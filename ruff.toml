target-version = "py314"

[lint.per-file-ignores]
# These modules establish bootstrap, re-exec, compatibility-facade, or optional
# dependency state before importing the code that consumes it. Keep E402 local
# to those barriers so a new late import anywhere else still fails the gate.
"StreamKeep.py" = ["E402"]
"streamkeep/db/_legacy.py" = ["E402"]
"streamkeep/extractors/__init__.py" = ["E402"]
"streamkeep/http.py" = ["E402"]
"streamkeep/ui/main_window.py" = ["E402"]
"streamkeep/workers/download.py" = ["E402"]
"tests/test_extractors.py" = ["E402"]
